<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Theater Setup Trainer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{
  --ink:#0e1013; --panel-1:#23272e; --panel-2:#181b20; --panel-3:#12151a;
  --bezel:#383d45; --bezel-2:#2a2f37;
  --text:#ece6d8; --muted:#959ca5;
  --amber:#e3a23c; --amber-dim:#a9802f; --amber-soft:rgba(227,162,60,.13);
  --green:#69c089; --red:#e3655d; --cyan:#62c8d8;
  --f-display:'Barlow Condensed','Oswald','Arial Narrow',sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:radial-gradient(120% 80% at 50% -10%,#1a1e24 0%,var(--ink) 55%) fixed,var(--ink);
  color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
::selection{background:var(--amber-soft)}
.metal{background:repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px),
  linear-gradient(180deg,#262b32 0%,#1c2025 60%,#181c21 100%);
  border:1px solid var(--bezel);border-radius:10px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),inset 0 -1px 0 rgba(0,0,0,.5),0 8px 26px rgba(0,0,0,.4)}
.shell{max-width:1180px;margin:0 auto;padding:16px 16px 56px}

/* header */
.faceplate{display:flex;align-items:center;gap:16px;padding:13px 18px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.power-dot{width:11px;height:11px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px 1px var(--amber),inset 0 0 3px rgba(0,0,0,.4);flex:none}
.brand-name{font-family:var(--f-display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:18px;line-height:1}
.brand-sub{font-family:var(--f-mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--amber-dim);margin-top:4px}
.status-read{margin-left:auto;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.status-read b{color:var(--text)}

/* control bar */
.controlbar{display:flex;align-items:center;gap:14px 22px;padding:12px 16px;margin-bottom:14px;flex-wrap:wrap}
.cb-group{display:flex;align-items:center;gap:10px}
.cb-label{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;background:var(--panel-3);border:1px solid var(--bezel);border-radius:8px;padding:3px;gap:2px}
.seg button{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.06em;font-weight:600;font-size:13px;color:var(--muted);background:transparent;border:0;padding:8px 14px;border-radius:6px;cursor:pointer;transition:.15s}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--amber-soft);color:var(--amber);box-shadow:inset 0 0 0 1px rgba(227,162,60,.4)}
.seg.views button[aria-pressed="true"]{background:rgba(98,200,216,.12);color:var(--cyan);box-shadow:inset 0 0 0 1px rgba(98,200,216,.4)}

/* layout */
.work{display:grid;grid-template-columns:1fr 360px;gap:14px;align-items:start}
.stage{padding:16px;position:relative;overflow:hidden}
.stage-cap{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px;flex-wrap:wrap}
.stage-title{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:19px}
.stage-hint{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stage-hint .blip{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-right:6px;box-shadow:0 0 7px var(--amber);animation:blip 1.8s ease-in-out infinite;vertical-align:middle}
@keyframes blip{0%,100%{opacity:.4}50%{opacity:1}}
svg.diagram{width:100%;height:auto;display:block;border-radius:8px}

/* hotspots */
.hot{cursor:pointer}
.hot *{pointer-events:none}
.hot .hit{pointer-events:all}
.hot:focus{outline:none}
.hot .ring{opacity:0;transition:opacity .15s}
.hot:hover .ring{opacity:.55}
.hot.sel .ring{opacity:1}
.lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;fill:var(--text)}
.lbl-mut{fill:var(--muted)}
.lbl-sm{font-size:9px;letter-spacing:.12em;text-transform:uppercase}

/* detail panel */
.detail{padding:0;overflow:hidden;position:sticky;top:14px}
.dt-empty{padding:20px}
.dt-empty h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.05em;font-size:17px;margin:0 0 6px}
.dt-empty p{color:var(--muted);font-size:13.5px;margin:0 0 16px}
.legend{display:flex;flex-direction:column;gap:2px}
.leg-row{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:7px;cursor:pointer;border:1px solid transparent;transition:.12s;background:transparent;width:100%;text-align:left;color:inherit;font:inherit}
.leg-row:hover{background:var(--panel-3);border-color:var(--bezel-2)}
.leg-chip{width:14px;height:14px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.4)}
.leg-name{font-size:13px;flex:1}
.leg-code{font-family:var(--f-mono);font-size:10px;color:var(--muted);letter-spacing:.1em}

.dt-head{padding:16px 18px 14px;border-bottom:1px solid var(--bezel-2);background:linear-gradient(180deg,rgba(255,255,255,.02),transparent)}
.dt-kicker{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--amber-dim)}
.dt-name{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.02em;font-size:22px;line-height:1.05;margin-top:4px}
.dt-role{color:var(--muted);font-size:13px;margin-top:7px;line-height:1.5}
.dt-illu{display:flex;justify-content:center;align-items:center;padding:16px;background:var(--panel-3);border-bottom:1px solid var(--bezel-2)}
.dt-illu svg{height:150px;width:auto}
.dt-spec{display:flex;flex-wrap:wrap;gap:6px;padding:13px 18px 4px}
.spec{font-family:var(--f-mono);font-size:10px;letter-spacing:.04em;color:var(--text);background:var(--panel-3);border:1px solid var(--bezel-2);border-radius:5px;padding:5px 9px;display:inline-flex;gap:7px;align-items:center}
.spec .sc{width:9px;height:9px;border-radius:2px;border:1px solid rgba(0,0,0,.4)}
.spec b{color:var(--muted);font-weight:500}

.issues{padding:10px 14px 16px}
.issues-lab{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:8px 4px 6px}
.iss{border:1px solid var(--bezel-2);border-radius:8px;margin-bottom:8px;overflow:hidden;background:var(--panel-3)}
.iss-q{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;color:var(--text);font:inherit;font-size:13.5px;font-weight:500;padding:12px 13px;cursor:pointer}
.iss-q:hover{background:rgba(255,255,255,.02)}
.iss-q .tw{margin-left:auto;color:var(--amber);font-family:var(--f-mono);font-size:14px;transition:transform .18s;flex:none}
.iss.open .iss-q .tw{transform:rotate(45deg)}
.iss-dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--amber)}
.iss-body{display:none;padding:2px 14px 14px 31px}
.iss.open .iss-body{display:block}
.iss-body ol{margin:0;padding:0;list-style:none;counter-reset:s}
.iss-body li{counter-increment:s;position:relative;padding:7px 0 7px 30px;font-size:13px;line-height:1.5;color:var(--text);border-top:1px solid var(--bezel-2)}
.iss-body li:first-child{border-top:0}
.iss-body li::before{content:counter(s,decimal-leading-zero);position:absolute;left:0;top:7px;font-family:var(--f-mono);font-size:10px;color:var(--amber-dim);letter-spacing:.05em}
.iss-body li b{color:var(--amber-dim)}

.deselect{display:block;width:100%;text-align:center;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-weight:600;font-size:12px;color:var(--muted);background:transparent;border:0;border-top:1px solid var(--bezel-2);padding:12px;cursor:pointer}
.deselect:hover{color:var(--text)}

@media (max-width:920px){
  .work{grid-template-columns:1fr}
  .detail{position:static}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="shell">
  <header class="metal faceplate">
    <span class="power-dot" aria-hidden="true"></span>
    <div>
      <div class="brand-name">Audiophia</div>
      <div class="brand-sub">Field Support Academy</div>
    </div>
    <div class="status-read" id="status">SETUP&nbsp; <b>5.1</b></div>
  </header>

  <section class="metal controlbar">
    <div class="cb-group">
      <span class="cb-label">Configuration</span>
      <div class="seg" id="configSeg" role="group" aria-label="Speaker configuration">
        <button data-c="2.1" aria-pressed="false">2.1</button>
        <button data-c="3.1" aria-pressed="false">3.1</button>
        <button data-c="5.1" aria-pressed="true">5.1</button>
        <button data-c="7.1" aria-pressed="false">7.1</button>
      </div>
    </div>
    <div class="cb-group">
      <span class="cb-label">View</span>
      <div class="seg views" id="viewSeg" role="group" aria-label="Diagram view">
        <button data-v="room" aria-pressed="true">Room</button>
        <button data-v="front" aria-pressed="false">AVR Front</button>
        <button data-v="back" aria-pressed="false">AVR Back</button>
      </div>
    </div>
  </section>

  <div class="work">
    <section class="metal stage">
      <div class="stage-cap">
        <div class="stage-title" id="stageTitle">Room layout</div>
        <div class="stage-hint"><span class="blip"></span>Click any component to troubleshoot</div>
      </div>
      <div id="stage"></div>
    </section>
    <aside class="metal detail" id="detail"></aside>
  </div>
</div>

<script>
(function(){
"use strict";
var SVGNS="http://www.w3.org/2000/svg";
var stage=document.getElementById('stage');
var detail=document.getElementById('detail');
var statusEl=document.getElementById('status');
var stageTitle=document.getElementById('stageTitle');

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ---------- speaker / channel definitions (CEA color code) ---------- */
var SPK={
  FL:{label:'Front Left',short:'FL',type:'tower',cea:'#e9e9e9',ceaName:'White',term:'FRONT L',passive:true},
  FR:{label:'Front Right',short:'FR',type:'tower',cea:'#e0625b',ceaName:'Red',term:'FRONT R',passive:true},
  C :{label:'Center',short:'C',type:'center',cea:'#69c089',ceaName:'Green',term:'CENTER',passive:true},
  SW:{label:'Subwoofer',short:'SW',type:'sub',cea:'#9b7fd0',ceaName:'Purple',term:'SUBWOOFER PRE-OUT',passive:false},
  SL:{label:'Surround Left',short:'SL',type:'bookshelf',cea:'#5b9bd5',ceaName:'Blue',term:'SURROUND L',passive:true},
  SR:{label:'Surround Right',short:'SR',type:'bookshelf',cea:'#9aa0a6',ceaName:'Gray',term:'SURROUND R',passive:true},
  SBL:{label:'Surround Back Left',short:'SBL',type:'bookshelf',cea:'#a9714a',ceaName:'Brown',term:'SURR BACK L',passive:true},
  SBR:{label:'Surround Back Right',short:'SBR',type:'bookshelf',cea:'#d8b48a',ceaName:'Tan',term:'SURR BACK R',passive:true}
};
var CONFIGS={
  '2.1':['FL','FR','SW'],
  '3.1':['FL','FR','C','SW'],
  '5.1':['FL','FR','C','SW','SL','SR'],
  '7.1':['FL','FR','C','SW','SL','SR','SBL','SBR']
};
/* top-down room coordinates (viewBox 0 0 860 620) */
var POS={
  FL:{x:150,y:150},FR:{x:710,y:150},C:{x:430,y:118},
  SW:{x:185,y:225},SL:{x:96,y:370},SR:{x:764,y:370},
  SBL:{x:300,y:556},SBR:{x:560,y:556}
};
var AVR={x:430,y:178};      /* receiver position (cable convergence) */
var SOFA={x:430,y:470};

/* ---------- troubleshooting content ---------- */
function chDrives(short){
  if(short==='SL'||short==='SR') return 'this channel only plays when the source is surround (5.1/7.1) and the AVR is in a surround sound mode — not in Stereo/Pure Direct';
  if(short==='SBL'||short==='SBR') return 'this channel needs 7.1 content (or the AVR set to upmix) and a surround sound mode — stereo and 5.1 material leave it silent by design';
  return 'this channel plays in stereo and surround modes';
}
function speakerIssues(s){
  if(s.short==='SW'){
    return [
      {q:'No bass / subwoofer is silent',steps:[
        '<b>Power.</b> The sub is active — confirm its own power cable is plugged in and the rear power switch is ON. Many subs drop to auto-standby; play loud bass content to wake it or set the switch to ON.',
        '<b>Signal cable.</b> Trace the RCA cable from the AVR <b>SUBWOOFER PRE-OUT</b> to the sub\u2019s LINE/LFE input. Re-seat both ends; a pulled RCA is the most common cause.',
        '<b>AVR setup.</b> In Speaker Config, confirm Subwoofer = Yes and set the crossover near 80 Hz with the other speakers set to \u201CSmall\u201D so lows are routed to the sub.',
        '<b>Sub gain.</b> Check the volume/gain knob on the sub itself isn\u2019t at minimum.',
        '<b>Channel level.</b> Raise the Subwoofer level trim in the AVR\u2019s level menu if it\u2019s still weak.'
      ]},
      {q:'Bass is boomy or overpowering',steps:[
        '<b>Gain.</b> Lower the sub\u2019s gain knob and/or the AVR subwoofer trim.',
        '<b>Placement.</b> Corners reinforce bass — move the sub out of the corner to reduce boom.',
        '<b>Phase.</b> Try the 0\u00B0/180\u00B0 phase switch; pick whichever setting gives fuller, tighter bass at the seat.',
        '<b>Crossover.</b> If the sub has its own low-pass knob, set it to max (bypass) and let the AVR manage the crossover.'
      ]}
    ];
  }
  return [
    {q:'No sound from the '+s.label.toLowerCase(),steps:[
      '<b>Content & mode.</b> Confirm '+chDrives(s.short)+'.',
      '<b>Both wire ends.</b> Check the binding posts at the speaker and the matching <b>'+s.term+'</b> terminal on the AVR. Re-seat the conductors; make sure no loose strands bridge + and \u2212.',
      '<b>Polarity.</b> Keep + (red) to + and \u2212 (black) to \u2212 at both ends. A reversed end puts the speaker out of phase — thin, hollow, weak.',
      '<b>Swap test.</b> Move this speaker\u2019s wires to a known-good channel on the AVR. If it plays there, the cable run or AVR channel is suspect; if it stays silent, suspect the speaker.',
      '<b>Assignment & level.</b> In the AVR, confirm '+s.short+' is enabled in Speaker Config and its level trim isn\u2019t at minimum.'
    ]},
    {q:'Sound is weak, thin, or lacks bass',steps:[
      '<b>Phase.</b> The classic cause is a reversed polarity on one end — verify + and \u2212 match at both the speaker and the AVR.',
      '<b>Level & distance.</b> Re-run auto-calibration, or set this channel\u2019s level and distance manually in the AVR.',
      '<b>Speaker size.</b> If set to \u201CSmall,\u201D that\u2019s normal — bass is routed to the sub via the crossover.'
    ]},
    {q:'Crackle or distortion',steps:[
      '<b>Loose strands.</b> A stray wire whisker at the terminal can intermittently short — power down, re-strip, and re-seat cleanly.',
      '<b>Overdrive.</b> Lower the volume; persistent distortion at moderate levels can mean the speaker or amp channel is stressed.',
      '<b>Impedance.</b> Confirm the speaker\u2019s impedance matches the AVR\u2019s rating (commonly 6\u20138 \u03A9).'
    ]}
  ];
}

var AVR_PARTS={
  'fp-power':{kicker:'Front panel · Power',name:'Power / Standby',illu:'avr',
    role:'Switches the receiver between standby and on. The indicator glows when powered.',
    issues:[
      {q:'Receiver won\u2019t turn on',steps:[
        '<b>Power source.</b> Confirm the AC cord is firmly seated at the AVR and the wall/surge strip, and the strip is switched on.',
        '<b>Standby light.</b> A dim standby light means it has power but isn\u2019t on — press Power once, firmly.',
        '<b>Surge lockout.</b> After a power event, unplug for 60 seconds, then plug back in to clear a latched state.'
      ]},
      {q:'Turns on, then shuts off (protection)',steps:[
        '<b>This is protection mode</b> — the AVR guarding against a fault, most often a speaker-wire short.',
        '<b>Power down & unplug</b> before touching anything.',
        '<b>Inspect terminals</b> for a stray + strand touching \u2212 or chassis; re-dress so conductors can\u2019t cross.',
        '<b>Impedance.</b> Confirm no speaker is below the AVR\u2019s minimum impedance rating.'
      ]}
    ]},
  'fp-volume':{kicker:'Front panel · Master Volume',name:'Master Volume',illu:'knob',
    role:'Sets overall output level across all channels. Often shown on the display in dB.',
    issues:[
      {q:'No sound at all from any speaker',steps:[
        '<b>Mute.</b> Check the display for a MUTE indicator and clear it.',
        '<b>Level.</b> Raise the volume — relative dB scales can sit very low after a reset.',
        '<b>Input.</b> Confirm the selected Source actually has audio and is the device that\u2019s playing.',
        '<b>Listening mode.</b> Pure Direct / analog-only modes can bypass processing; switch to a standard mode.'
      ]}
    ]},
  'fp-source':{kicker:'Front panel · Source',name:'Source / Input Select',illu:'knob',
    role:'Selects which connected device the AVR listens to and displays.',
    issues:[
      {q:'No picture or sound from a device',steps:[
        '<b>Right source.</b> Rotate to the input the device is physically plugged into (e.g., the HDMI labeled for it).',
        '<b>Input assignment.</b> If the source name and jack don\u2019t match, fix the HDMI input assignment in the AVR setup.',
        '<b>Device on.</b> Confirm the source device is powered and outputting.'
      ]}
    ]},
  'fp-display':{kicker:'Front panel · Display',name:'Front Display',illu:'display',
    role:'Shows volume, selected source, incoming audio format, and status/error messages.',
    issues:[
      {q:'Display shows an error or keeps blinking',steps:[
        '<b>Read it.</b> A blinking display with shutdown usually signals protection — check speaker wiring for shorts.',
        '<b>Format.</b> The format readout (PCM / Dolby / DTS) tells you what the source is actually sending — useful when surrounds are silent.',
        '<b>Dimmer.</b> A dark display may just be the dimmer setting, not a fault.'
      ]}
    ]},
  'fp-mic':{kicker:'Front panel · Setup Mic',name:'Calibration Mic Jack',illu:'mic',
    role:'Input for the bundled measurement microphone used by auto-calibration (Audyssey).',
    issues:[
      {q:'System sounds unbalanced / uncalibrated',steps:[
        '<b>Run calibration.</b> Plug the mic in here, place it at ear height at the main seat, and run the AVR\u2019s auto setup.',
        '<b>Mic position.</b> Measure from the listening position, not next to the speakers.',
        '<b>Result check.</b> Calibration sets per-channel level, distance, and crossover — the single biggest quality step.'
      ]}
    ]},
  'fp-phones':{kicker:'Front panel · Headphones',name:'Headphone Jack',illu:'mic',
    role:'Front output for private listening; inserting a plug usually mutes the speakers.',
    issues:[
      {q:'Speakers went silent',steps:[
        '<b>Check the jack.</b> A plug (or adapter) left in the headphone jack mutes the speaker outputs — remove it.',
        '<b>Partial insert.</b> A half-seated plug can confuse detection; fully remove or fully insert.'
      ]}
    ]},
  'hdmi-out':{kicker:'Back panel · HDMI Monitor Out',name:'HDMI Out (ARC / eARC)',illu:'hdmi',
    role:'Sends video to the TV and, via ARC/eARC, receives the TV\u2019s own app audio back into the AVR.',
    issues:[
      {q:'No sound from the TV\u2019s built-in apps',steps:[
        '<b>ARC ports.</b> The cable must run from this <b>ARC/eARC</b> HDMI out to the TV\u2019s <b>ARC/eARC</b> HDMI port — not a regular HDMI input.',
        '<b>Enable CEC.</b> Turn on HDMI-CEC at both ends (brand names: Anynet+, Bravia Sync, SimpLink, VIERA Link) and set the TV audio output to the receiver/ARC.',
        '<b>Atmos drops.</b> Full Atmos needs <b>eARC</b> at both ends and the TV digital-audio set to Auto/Passthrough (not PCM).'
      ]},
      {q:'No picture on the TV',steps:[
        '<b>TV input.</b> Select the TV input that this HDMI cable feeds.',
        '<b>Cable.</b> Use a High-Speed/Ultra HDMI cable; re-seat both ends.'
      ]}
    ]},
  'hdmi-in':{kicker:'Back panel · HDMI Inputs',name:'HDMI Inputs',illu:'hdmi',
    role:'Where source devices (streamer, console, Blu-ray) connect for video and audio.',
    issues:[
      {q:'A connected source has no signal',steps:[
        '<b>Match the source.</b> Select the AVR input that matches the jack the device is plugged into.',
        '<b>Assignment.</b> If labels and jacks don\u2019t line up, correct the HDMI input assignment in setup.',
        '<b>Try another port.</b> Move the device to a different HDMI input to rule out a bad port.'
      ]}
    ]}
};

/* ---------- product illustrations (front elevation) ---------- */
function illu(kind,color){
  color=color||'#cfd3d8';
  var grille='url(#grille)';
  if(kind==='tower'){
    return svgWrap(120,150,
      defsGrille()+
      '<rect x="34" y="6" width="52" height="138" rx="6" fill="#1d2025" stroke="#3a3f47"/>'+
      '<rect x="40" y="12" width="40" height="126" rx="4" fill="#15181c" stroke="#2c3138"/>'+
      '<circle cx="60" cy="34" r="9" fill="#0c0e11" stroke="#3a3f47"/>'+         /* tweeter */
      '<circle cx="60" cy="70" r="16" fill="#0c0e11" stroke="#3a3f47"/><circle cx="60" cy="70" r="6" fill="#23272e"/>'+
      '<circle cx="60" cy="110" r="16" fill="#0c0e11" stroke="#3a3f47"/><circle cx="60" cy="110" r="6" fill="#23272e"/>'+
      '<rect x="34" y="6" width="52" height="138" rx="6" fill="none" stroke="'+color+'" stroke-opacity=".4"/>'+
      '<rect x="40" y="139" width="40" height="4" rx="2" fill="'+color+'" opacity=".5"/>');
  }
  if(kind==='bookshelf'){
    return svgWrap(120,150,
      '<rect x="30" y="40" width="60" height="74" rx="5" fill="#1d2025" stroke="#3a3f47"/>'+

function svgWrap(w,h,inner){return '<svg viewBox="0 0 '+w+' '+h+'" xmlns="http://www.w3.org/2000/svg">'+inner+'</svg>';}

function knurl(cx,cy,r1,r2,n){var o='';for(var i=0;i<n;i++){var a=i/n*Math.PI*2;o+='<line x1="'+(cx+Math.cos(a)*r1).toFixed(1)+'" y1="'+(cy+Math.sin(a)*r1).toFixed(1)+'" x2="'+(cx+Math.cos(a)*(r2-6)).toFixed(1)+'" y2="'+(cy+Math.sin(a)*(r2-6)).toFixed(1)+'"/>';}return o;}

function speakerTopDown(key){
  var s=SPK[key],p=POS[key];
  var sel=state.selected===key?' sel':'';
  var w,h;
  if(s.type==='center'){w=64;h=22;}
  else if(s.type==='sub'){w=40;h=40;}
  else if(s.type==='tower'){w=30;h=34;}
  else{w=34;h=26;}
  var x=p.x-w/2,y=p.y-h/2;
  // grille edge facing the sofa
  var dx=SOFA.x-p.x, dy=SOFA.y-p.y, edge;
  if(s.type==='sub'){edge='';}
  else if(Math.abs(dx)>Math.abs(dy)){ // face left/right
    edge='<rect x="'+(dx>0?x+w-4:x)+'" y="'+(y+3)+'" width="4" height="'+(h-6)+'" rx="2" fill="'+s.cea+'"/>';
  } else { // face up/down
    edge='<rect x="'+(x+3)+'" y="'+(dy>0?y+h-4:y)+'" width="'+(w-6)+'" height="4" rx="2" fill="'+s.cea+'"/>';
  }
  var driver=s.type==='sub'
    ? '<circle cx="'+p.x+'" cy="'+p.y+'" r="11" fill="#0c0e11" stroke="#3a3f47"/><circle cx="'+p.x+'" cy="'+p.y+'" r="4" fill="#2a2e35"/>'
    : '<rect x="'+(x+4)+'" y="'+(y+4)+'" width="'+(w-8)+'" height="'+(h-8)+'" rx="3" fill="#15181c" stroke="#2c3138"/>';
  var labelY=p.y+h/2+15;
  return '<g class="hot'+sel+'" data-id="'+key+'" tabindex="0" role="button" aria-label="'+esc(s.label)+'">'+
    '<rect class="ring" opacity="0" x="'+(x-7)+'" y="'+(y-7)+'" width="'+(w+14)+'" height="'+(h+14)+'" rx="8" fill="none" stroke="'+s.cea+'" stroke-width="2"/>'+
    '<rect class="hit" x="'+(x-7)+'" y="'+(y-7)+'" width="'+(w+14)+'" height="'+(h+30)+'" rx="8" fill="transparent"/>'+
    '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="4" fill="#22262d" stroke="#3a3f47"/>'+
    driver+edge+
    '<text class="lbl lbl-sm" x="'+p.x+'" y="'+labelY+'" text-anchor="middle" fill="'+s.cea+'">'+s.short+'</text>'+
  '</g>';
}
function cablePath(key){

    '<rect class="hit" x="520" y="250" width="150" height="56" rx="8" fill="transparent"/>'+
    '<path d="M540 272 h70 l-8 11 h-54 z" fill="#1a1d22" stroke="#3a3f47" stroke-width="2"/>'+
    '<text class="lbl lbl-sm" x="595" y="300" text-anchor="middle" fill="#62c8d8">MONITOR OUT · ARC</text>'+
  '</g>';
  var hdmiIn='<g class="hot'+hiSel+'" data-id="hdmi-in" tabindex="0" role="button" aria-label="HDMI inputs">'+
    '<rect class="ring" opacity="0" x="684" y="250" width="172" height="56" rx="8" fill="none" stroke="#62c8d8" stroke-width="2"/>'+
    '<rect class="hit" x="684" y="250" width="172" height="56" rx="8" fill="transparent"/>'+
    '<path d="M700 272 h40 l-6 9 h-28 z" fill="#1a1d22" stroke="#3a3f47" stroke-width="2"/>'+
    '<path d="M752 272 h40 l-6 9 h-28 z" fill="#1a1d22" stroke="#3a3f47" stroke-width="2"/>'+
    '<path d="M804 272 h40 l-6 9 h-28 z" fill="#1a1d22" stroke="#3a3f47" stroke-width="2"/>'+
    '<text class="lbl lbl-sm" x="770" y="300" text-anchor="middle" fill="#62c8d8">HDMI INPUTS</text>'+
  '</g>';
  return '<svg class="diagram" viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AVR back panel">'+
    '<defs><linearGradient id="back" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#202329"/><stop offset="1" stop-color="#131519"/></linearGradient></defs>'+
    '<rect x="14" y="14" width="872" height="312" rx="12" fill="url(#back)" stroke="#3a3f47" stroke-width="2"/>'+
    '<text class="lbl lbl-sm lbl-mut" x="40" y="42">SPEAKER TERMINALS · CEA COLOR CODE</text>'+
    '<line x1="40" y1="58" x2="860" y2="58" stroke="#2c3138"/>'+
    posts+
    '<text class="lbl lbl-sm lbl-mut" x="40" y="240">PRE-OUT</text>'+
    '<text class="lbl lbl-sm lbl-mut" x="516" y="240">VIDEO · HDMI</text>'+
    subOut+hdmiOut+hdmiIn+
    '<text class="lbl lbl-sm lbl-mut" x="860" y="320" text-anchor="end">DIMMED TERMINALS ARE UNUSED IN '+state.config+'</text>'+
  '</svg>';
}

/* ---------- detail panel ---------- */
function detailFor(id){
  if(SPK[id]){
    var s=SPK[id];
    var kind=s.type;
    var specs='<div class="dt-spec">'+
      '<span class="spec"><span class="sc" style="background:'+s.cea+'"></span><b>CEA</b>'+s.ceaName+'</span>'+
      '<span class="spec"><b>Terminal</b>'+esc(s.term)+'</span>'+
      '<span class="spec"><b>Type</b>'+(s.passive?'Passive':'Active')+'</span>'+
    '</div>';
    var role=s.short==='SW'
      ? 'Active subwoofer. Connects to the AVR\u2019s SUBWOOFER PRE-OUT by RCA and has its own power and amplifier — it does not use speaker wire.'
      : 'Passive '+kind+' speaker driven by the AVR\u2019s '+s.term+' amplifier channel over two-conductor speaker wire.';
    return {kicker:s.short==='SW'?'Loudspeaker · LFE':'Loudspeaker · '+s.short, name:s.label, role:role, illu:kind, color:s.cea, specs:specs, issues:speakerIssues(s)};
  }
  if(id==='avr'){
    return {kicker:'Component', name:'AV Receiver', illu:'avr', color:'#62c8d8',
      role:'The hub of the system. It powers every passive speaker, feeds the subwoofer pre-out, switches HDMI sources, and decodes surround formats. Open the AVR Front and AVR Back views to click individual controls and terminals.',
      specs:'<div class="dt-spec"><span class="spec"><b>Reference</b>Denon / Marantz</span><span class="spec"><b>Config</b>'+state.config+'</span></div>',
      issues:[
        {q:'Where do I start a setup?',steps:[
          '<b>Confirm the model</b> and the speaker count for this layout ('+state.config+').',
          '<b>Wire passive speakers</b> to their color-matched terminals on the back panel, watching polarity.',
          '<b>Connect the sub</b> by RCA to SUBWOOFER PRE-OUT.',
          '<b>Connect the TV</b> by HDMI from MONITOR OUT (ARC) to the TV\u2019s ARC port; enable CEC.',
          '<b>Run calibration</b> with the setup mic at the listening position.'
        ]},
        {q:'Receiver shuts off after a few seconds',steps:[
          '<b>Protection mode.</b> Almost always a speaker-wire short. Power off and unplug.',
          '<b>Inspect every terminal</b> for stray strands bridging + and \u2212.',
          '<b>Re-dress and retest</b> at low volume.'
        ]}
      ]};
  }
  var p=AVR_PARTS[id];
  if(p) return {kicker:p.kicker,name:p.name,role:p.role,illu:p.illu,color:'#62c8d8',specs:'',issues:p.issues};
  return null;
}

function renderDetail(){
  if(!state.selected){
    var keys=CONFIGS[state.config];
    var rows=keys.map(function(k){
      var s=SPK[k];
      return '<button class="leg-row" data-id="'+k+'">'+
        '<span class="leg-chip" style="background:'+s.cea+'"></span>'+
        '<span class="leg-name">'+esc(s.label)+'</span>'+
        '<span class="leg-code">'+s.short+'</span>'+
      '</button>';
    }).join('');
    rows+='<button class="leg-row" data-id="avr"><span class="leg-chip" style="background:#62c8d8"></span><span class="leg-name">AV Receiver</span><span class="leg-code">AVR</span></button>';
    detail.innerHTML='<div class="dt-empty">'+
      '<h3>'+state.config+' configuration</h3>'+
      '<p>'+keys.length+' connected components. Click a part in the diagram \u2014 or pick one below \u2014 to open its troubleshooting actions.</p>'+
      '<div class="legend">'+rows+'</div>'+
    '</div>';
    bindLegend();
    return;
  }
  var d=detailFor(state.selected);
  if(!d){state.selected=null;return renderDetail();}
  var issues=d.issues.map(function(it,i){
    var steps=it.steps.map(function(st){return '<li>'+st+'</li>';}).join('');
    return '<div class="iss" data-iss="'+i+'">'+
      '<button class="iss-q"><span class="iss-dot" style="background:'+d.color+'"></span>'+esc(it.q)+'<span class="tw">+</span></button>'+
      '<div class="iss-body"><ol>'+steps+'</ol></div>'+
    '</div>';
  }).join('');
  detail.innerHTML=
    '<div class="dt-head"><div class="dt-kicker">'+esc(d.kicker)+'</div>'+
      '<div class="dt-name">'+esc(d.name)+'</div>'+
      '<div class="dt-role">'+d.role+'</div></div>'+
    '<div class="dt-illu">'+illu(d.illu,d.color)+'</div>'+
    (d.specs||'')+
    '<div class="issues"><div class="issues-lab">Troubleshooting actions</div>'+issues+'</div>'+
    '<button class="deselect">‹ Back to component list</button>';
  // open first issue by default
  var first=detail.querySelector('.iss');
  if(first) first.classList.add('open');
  Array.prototype.forEach.call(detail.querySelectorAll('.iss-q'),function(b){
    b.addEventListener('click',function(){b.parentNode.classList.toggle('open');});
  });
  detail.querySelector('.deselect').addEventListener('click',function(){state.selected=null;renderAll();});
}
function bindLegend(){
  Array.prototype.forEach.call(detail.querySelectorAll('.leg-row'),function(b){
    b.addEventListener('click',function(){select(b.getAttribute('data-id'));});
  });
}

/* ---------- render + events ---------- */
function renderStage(){
  if(state.view==='room'){stageTitle.textContent='Room layout · '+state.config;stage.innerHTML=roomDiagram();}
  else if(state.view==='front'){stageTitle.textContent='AVR front panel';stage.innerHTML=frontPanel();}
  else{stageTitle.textContent='AVR back panel · '+state.config;stage.innerHTML=backPanel();}
  Array.prototype.forEach.call(stage.querySelectorAll('.hot[data-id]'),function(g){
    var id=g.getAttribute('data-id');
    if(!id)return;
    g.addEventListener('click',function(){select(id);});
    g.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();select(id);}});
  });
  var selRing=stage.querySelector('.hot.sel .ring');
  if(selRing)selRing.setAttribute('opacity','1');
}
function renderAll(){renderStage();renderDetail();}
function select(id){
  if(!id)return;
  state.selected=id;
  // if a back-panel terminal selected while in room, keep current view
  renderAll();
  if(window.innerWidth<=920){detail.scrollIntoView({behavior:'smooth',block:'start'});}
}

document.getElementById('configSeg').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  state.config=b.getAttribute('data-c');
  Array.prototype.forEach.call(this.querySelectorAll('button'),function(x){x.setAttribute('aria-pressed',x===b);});
  statusEl.innerHTML='SETUP&nbsp; <b>'+state.config+'</b>';
  // if selected speaker no longer in config, clear it
  if(state.selected&&SPK[state.selected]&&CONFIGS[state.config].indexOf(state.selected)<0&&state.selected!=='SW')state.selected=null;
  renderAll();
});
document.getElementById('viewSeg').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  state.view=b.getAttribute('data-v');
  Array.prototype.forEach.call(this.querySelectorAll('button'),function(x){x.setAttribute('aria-pressed',x===b);});
  renderAll();
});

renderAll();
})();
</script>
</body>
</html>
